name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toolbox
          POSTGRES_PASSWORD: toolbox
          POSTGRES_DB: toolbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U toolbox -d toolbox"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://toolbox:toolbox@localhost:5432/toolbox

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://toolbox:toolbox@localhost:5432/toolbox

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://toolbox:toolbox@localhost:5432/toolbox
